<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link id="call-engine-module" rel="modulepreload" href="./bundle.js?v=5b8cfcc2adcbe86809624c01caf3535982f2aae0613eb5dca93952dcf403fe64" />
    <title>Jotmo 通话</title>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        let context = {};
        try {
          const parsed = JSON.parse(window.name || "{}");
          context = { callRequestId: String(parsed.callRequestId || (window.arkmeCallTransport && new URLSearchParams(location.search).get("callRequestId")) || "") };
        } catch (_) {
          context = {};
        }

        const pending = [];
        const listeners = [];
        window.JotmoDesktopCallBridge = {
          postMessage(message) {
            const payload = typeof message === "string" ? message : JSON.stringify(message);
            if (window.arkmeCallTransport) {
              window.arkmeCallTransport.emit(payload);
              return;
            }
            parent.postMessage({
              channel: "jotmo-desktop-call",
              callRequestId: context.callRequestId,
              message: payload,
            }, location.origin);
          },
        };
        window.__JOTMO_DESKTOP_CALL_HOST__ = {
          postFlutterMessage(message) {
            window.JotmoDesktopCallBridge.postMessage(message);
            return true;
          },
          onHostMessage(message) {
            pending.push(message);
            listeners.forEach((listener) => listener());
          },
          drain() {
            return pending.splice(0, pending.length);
          },
          subscribe(listener) {
            listeners.push(listener);
            return () => {
              const index = listeners.indexOf(listener);
              if (index >= 0) listeners.splice(index, 1);
            };
          },
        };

        if (window.arkmeCallTransport) {
          const drag = document.createElement("div");
          drag.setAttribute("aria-hidden", "true");
          drag.style.cssText = "position:fixed;top:0;left:0;right:56px;height:24px;z-index:10;-webkit-app-region:drag";
          document.body.append(drag);
          window.arkmeCallTransport.attach(command => window.__JOTMO_DESKTOP_CALL_HOST__.onHostMessage(command));
        }

        const blockGlobal = (name) => {
          try {
            Object.defineProperty(globalThis, name, {
              configurable: true,
              enumerable: false,
              get() { return undefined; },
              set(_) {},
            });
          } catch (_) {
            try { globalThis[name] = undefined; } catch (_) {}
          }
        };
        ["process", "global", "module", "require"].forEach(blockGlobal);
        const bundleUrl = document.getElementById("call-engine-module").href;
        import(bundleUrl).catch((error) => {
          window.__JOTMO_DESKTOP_CALL_HOST__.postFlutterMessage(JSON.stringify({
            type: "fatal_error",
            message: error instanceof Error ? error.message : "呼叫界面加载失败",
          }));
        });
      })();
    </script>
  </body>
</html>
