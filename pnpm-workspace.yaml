packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false

# DSH JSONL persistence needs this locked native binding to verify its prebuild.
allowBuilds:
  koffi@3.1.1: true
  # These locked packages ship their runtime artifacts; their install hooks only
  # print messages. Explicitly deny them so strict CI installs stay reproducible.
  '@google/genai@2.21.0': false
  protobufjs@7.6.6: false
