name: 构建并发布 Arkme 插件生产 Runtime
run-name: 发布 Arkme 生产 Runtime v${{ github.event.client_payload.version }}

on:
  repository_dispatch:
    # 兼容旧工作流重跑时发送的 release-published 事件。
    types: [arkme-plugin-release-prepared, arkme-plugin-release-published]

env:
  # 安装和打包复用显式构建的产物。
  ARKME_SKIP_PREPARE_BUILD: 'true'

concurrency:
  group: plugin-production-runtime-publish
  queue: max
  cancel-in-progress: false

jobs:
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/test-shards.yml
    with:
      ref: ${{ github.sha }}
      # 测试服默认启用；生产 Runtime 已在发版前测试，默认关闭重复测试。
      enabled: false
      release-sha: ${{ github.event.client_payload.release_sha }}
      release-version: ${{ github.event.client_payload.version }}

  publish-runtime:
    needs: tests
    if: ${{ !cancelled() && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    name: 构建并发布 Arkme 生产 Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ github.event.client_payload.version }}
      ARKME_RELEASE_SOURCE_SHA: ${{ github.event.client_payload.release_sha }}
      ARKME_SOURCE_DIR: runtime-source
      ARKME_RELEASE_NOTES_DIR: .production-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: 验证生产版本与提交
        env:
          RELEASE_SHA: ${{ github.event.client_payload.release_sha }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '发布提交格式无效。' >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '发布版本格式无效。' >&2
            exit 1
          fi

          git fetch origin master
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/master; then
            echo '发布提交不属于当前 master 历史。' >&2
            exit 1
          fi

          release_version=$(git show "${RELEASE_SHA}:package.json" | node -e \
            "const fs = require('node:fs'); process.stdout.write(JSON.parse(fs.readFileSync(0, 'utf8')).version)")
          if [ "$release_version" != "$VERSION" ]; then
            echo '发布提交中的版本与事件不一致。' >&2
            exit 1
          fi

      - name: 检出精确发布提交
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.release_sha }}
          path: runtime-source
          fetch-depth: 0
          persist-credentials: false
      - name: 安装受信任的发布依赖
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: 恢复本版本更新说明
        id: notes-cache
        uses: actions/cache/restore@v4
        with:
          path: .production-release
          key: production-release-notes-v1-${{ github.event.client_payload.version }}-${{ github.event.client_payload.release_sha }}
      - name: 生成并保存生产更新说明
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          ARKME_BACKEND_BASE_URL: ${{ secrets.ARKME_BACKEND_BASE_URL }}
          ARKME_CI_TRIGGER_SECRET: ${{ secrets.ARKME_CI_TRIGGER_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RELEASE_NOTES_MODEL: ${{ vars.OPENAI_RELEASE_NOTES_MODEL }}
          ARKME_LEGACY_RUNTIME_IDS: ${{ vars.ARKME_LEGACY_RUNTIME_IDS }}
        run: node scripts/production-runtime-release.mjs prepare
      - name: 固定本版本更新说明
        if: steps.notes-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .production-release
          key: production-release-notes-v1-${{ github.event.client_payload.version }}-${{ github.event.client_payload.release_sha }}
      - name: 保存说明与证据
        uses: actions/upload-artifact@v4
        with:
          name: production-release-notes-${{ github.event.client_payload.version }}-${{ github.run_attempt }}
          path: .production-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: 安装精确源码依赖
        if: steps.notes.outputs.already_activated != 'true'
        working-directory: runtime-source
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          zstd --version
      - name: 校验、构建并打包 Runtime
        if: steps.notes.outputs.already_activated != 'true'
        working-directory: runtime-source
        run: |
          pnpm run typecheck
          pnpm run verify:call-assets
          pnpm run build
          pnpm run pack:runtime
      - name: 上传并激活生产 Runtime 后创建 Tag 与 Release
        env:
          DEBUG: ""
          GH_TOKEN: ${{ github.token }}
          ARKME_BACKEND_BASE_URL: ${{ secrets.ARKME_BACKEND_BASE_URL }}
          ARKME_CI_TRIGGER_SECRET: ${{ secrets.ARKME_CI_TRIGGER_SECRET }}
          ARKME_HARNESS_VERSION_CODE_RANGE: ${{ vars.ARKME_HARNESS_VERSION_CODE_RANGE }}
        run: node scripts/production-runtime-release.mjs publish
