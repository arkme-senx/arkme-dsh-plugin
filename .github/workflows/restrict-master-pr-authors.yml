name: 限制 master 拉取请求来源

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, edited, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  enforce-organization-members-only:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 校验并关闭未授权的拉取请求
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$AUTHOR_ASSOCIATION" = "MEMBER" ] \
            || [ "$AUTHOR_ASSOCIATION" = "OWNER" ] \
            || [ "$AUTHOR_ASSOCIATION" = "COLLABORATOR" ]; then
            echo "允许当前团队成员 $PR_AUTHOR 向 master 创建 PR。"
            exit 0
          fi
          if [ "$PR_AUTHOR" = "github-actions[bot]" ] \
            && [ "$HEAD_REPO" = "$GH_REPO" ] \
            && [[ "$HEAD_REF" == release/v* ]]; then
            echo "允许同仓自动发版分支 $HEAD_REF 向 master 创建 PR。"
            exit 0
          fi
          echo "关闭未授权来源 $PR_AUTHOR（$AUTHOR_ASSOCIATION）的 master PR。"
          gh pr close "$PR_NUMBER" --repo "$GH_REPO"
