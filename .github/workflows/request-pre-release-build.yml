name: 更新 pre-release 后请求测试服构建

on:
  push:
    branches: [pre-release]

concurrency:
  group: plugin-pre-release-build-request
  cancel-in-progress: false

jobs:
  request-backend-build:
    name: 调用 Backend 请求 Arkme 测试服构建
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: pre-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: 调用 Backend 请求 Arkme 测试服构建
        env:
          ARKME_BACKEND_BASE_URL: ${{ secrets.ARKME_BACKEND_BASE_URL }}
          ARKME_CI_TRIGGER_SECRET: ${{ secrets.ARKME_CI_TRIGGER_SECRET }}
        run: bash .github/scripts/request-arkme-build.sh
